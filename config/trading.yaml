trading:
  hours:
    end: '23:00'
    start: 01:00
  indicators:
    atr_period: 14
    ema_periods:
    - 20
    - 50
    - 200
    rsi_period: 14
    timeframes:
    - M15
    - M30
    - H1
    - H4
  risk:
    default_sl_pips: 80
    default_tp_pips: 160
    fixed_lot_size: 0.01
  signal_ttl:
    auto_requery_invalidate_cooldown_minutes: 5
    auto_requery_on_close: true
    auto_requery_on_expire: true
    auto_requery_on_invalidate: true
    enabled: true
    ttl_minutes: 30
  smc:
    enabled: true
    fair_value_gaps: true
    order_blocks: true
  trailing_stop:
    enabled: true
    activation_profit_percent: 40  # При каком % от TP активировать trailing
    trailing_step_percent: 10      # С каким шагом (в % от TP) двигать SL
  trend_filter:
    enabled: true
