trading:
  check_interval_seconds: 1
  hours:
    end: '23:00'
    start: 01:00
  indicators:
    atr_period: 14
    ema_periods:
    - 20
    - 50
    - 200
    rsi_period: 14
    timeframes:
    - M15
    - M30
    - H1
    - H4
  profit_protection:
    consecutive_wins: 3
    cooldown_minutes: 20
    enabled: true
  risk:
    default_sl_pips: 40
    default_tp_pips: 100
    fixed_lot_size: 0.01
  signal_quality:
    invert_signals: true
    min_confidence: 75
  signal_ttl:
    auto_requery_invalidate_cooldown_minutes: 5
    auto_requery_on_close: true
    auto_requery_on_expire: true
    auto_requery_on_invalidate: true
    enabled: true
    requery_cooldown_minutes: 15
    ttl_minutes: 10
  smc:
    enabled: true
    fair_value_gaps: true
    order_blocks: true
  stop_loss_protection:
    consecutive_stops: 2
    cooldown_minutes: 10
    enabled: true
  trailing_stop:
    activation_profit_percent: 30
    enabled: true
    trailing_step_percent: 10
  trend_filter:
    enabled: true
