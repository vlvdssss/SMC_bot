trading:
  hours:
    end: '22:00'
    start: 02:00
  indicators:
    atr_period: 14
    ema_periods:
    - 20
    - 50
    - 200
    rsi_period: 14
    timeframes:
    - M15
    - M30
    - H1
    - H4
  risk:
    default_sl_pips: 50
    default_tp_pips: 100
    max_lot_size: 1.0  # Максимальный размер позиции (лота)
                       # 0.01 лот = $1,000 | 0.1 лот = $10,000 | 1.0 лот = $100,000
                       # Рекомендация: 0.01-0.1 для безопасной торговли
                       # Для золота (XAUUSD): 1 лот = ~$200,000
  smc:
    enabled: true
    fair_value_gaps: true
    order_blocks: true
  trailing_stop:
    distance_pips: 20
    enabled: false
  trend_filter:
    enabled: true
