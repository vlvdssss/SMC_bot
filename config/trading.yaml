trading:
  hours:
    end: '23:00'
    start: 02:00
  indicators:
    atr_period: 14
    ema_periods:
    - 20
    - 50
    - 200
    rsi_period: 14
    timeframes:
    - M15
    - M30
    - H1
    - H4
  risk:
    default_sl_pips: 50
    default_tp_pips: 100
    max_lot_size: 1.0
  signal_ttl:
    auto_requery_on_close: true
    auto_requery_on_expire: true
    enabled: true
    ttl_minutes: 60
  smc:
    enabled: true
    fair_value_gaps: true
    order_blocks: true
  trailing_stop:
    activation_profit_pips: 20  # Активация после 20 пипсов профита ($2 на 0.01 лот)
    distance_pips: 15  # Держать SL на 15 пипсах от текущей цены (ближе к цене)
    enabled: true
    step_pips: 3  # Обновлять каждые 3 пипса (более частые обновления)
    breakeven:
      enabled: true  # Автоматический перевод в безубыток
      activation_profit_pips: 25  # Когда достигнем +25 пипсов ($2.50 на 0.01 лот)
      offset_pips: 5  # Ставим SL на +5 пипсов от входа (гарантия прибыли)
  trend_filter:
    enabled: true
