ai_enabled: true
manual_overrides:
  enabled: false
  eurusd:
    fixed_lot: null
    sl_pips: 30
    tp_pips: 50
  xauusd:
    fixed_lot: null
    sl_dollars: 4.5
    tp_dollars: 12.0
market_analyst:
  analysis_version: '1.0'
  blocks:
    auto_expire_hours: 12
    bias: 0.8
    hard_block: 0.0
    none: 1.0
    soft_block: 0.3
    warning: 0.5
  enabled: true
  fallback:
    max_stale_hours: 6
    on_error: warning
    use_stale_analysis: true
  gpt:
    api_key: null
    max_tokens: 4000
    model: gpt-4o
    temperature: 0.3
  prompt_version: 2026-01
  safety:
    max_daily_calls: 50
    max_monthly_cost: 50.0
    min_minutes_between_calls: 15
  schedule:
    enabled: true
    interval_minutes: 60
    mode: interval
    restrictions:
      night_block:
        enabled: false
        end: 02:00
        start: '22:00'
      weekend_block:
        enabled: true
        friday_start: '22:00'
        monday_end: '01:00'
    times: []
  screenshots:
    bars: 200
    cleanup_days: 7
    dpi: 150
    enabled: true
    timeframes:
    - M5
    - M15
  signal_validity_minutes: 30
  signals:
    auto_cleanup: true
    confidence_decay: true
    default_ttl_hours: 24
    validity_minutes: 60
news_filter:
  cache_duration: 3600
  enabled: false
  instruments:
  - XAUUSD
  openai:
    max_tokens: 100
    model: gpt-4o-mini
    temperature: 0.1
  risk_actions:
    EXTREME: skip
    HIGH: reduce_50
    LOW: trade
    MEDIUM: reduce_75
pure_ai:
  analysis_interval_minutes: 30
  enabled: true
  max_positions_per_symbol: 1
  symbols:
  - XAUUSD
  timeframes:
  - M5
  - M15
