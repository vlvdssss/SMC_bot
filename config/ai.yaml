ai_enabled: true
market_analyst:
  analysis_version: '1.0'
  blocks:
    auto_expire_hours: 12
    bias: 0.8
    hard_block: 0.0
    none: 1.0
    soft_block: 0.3
    warning: 0.5
  enabled: true
  fallback:
    max_stale_hours: 6
    on_error: warning
    use_stale_analysis: true
  gpt:
    max_tokens: 2000
    model: gpt-4o
    temperature: 0.3
  prompt_version: 2026-01
  safety:
    max_daily_calls: 10
    max_monthly_cost: 20.0
    min_minutes_between_calls: 30
  schedule:
    enabled: true
    restrictions:
      night_block:
        enabled: true
        end: 02:00
        start: '22:00'
      weekend_block:
        enabled: true
        friday_start: '22:00'
        monday_end: 02:00
    times:
    - 03:00
    - 03:15
    - 06:00
    - 09:00
    - '12:00'
    - '15:00'
    - '18:00'
    - '21:00'
  screenshots:
    bars: 100
    cleanup_days: 7
    dpi: 150
    enabled: true
    timeframes:
    - M15
    - H1
  signals:
    auto_cleanup: true
    confidence_decay: true
    default_ttl_hours: 24
    validity_minutes: 60  # Время жизни сигнала (минуты)
    min_confidence: 70
    min_rr: 1.5
news_filter:
  cache_duration: 3600
  enabled: true
  instruments:
  - XAUUSD
  openai:
    max_tokens: 100
    model: gpt-4o-mini
    temperature: 0.1
  risk_actions:
    EXTREME: skip
    HIGH: reduce_50
    LOW: trade
    MEDIUM: reduce_75
