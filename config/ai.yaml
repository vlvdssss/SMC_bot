ai_enabled: true
market_analyst:
  analysis_version: '1.0'
  blocks:
    auto_expire_hours: 12
    bias: 0.8
    hard_block: 0.0
    none: 1.0
    soft_block: 0.3
    warning: 0.5
  enabled: true
  fallback:
    max_stale_hours: 6
    on_error: warning
    use_stale_analysis: true
  gpt:
    max_tokens: 2000
    model: gpt-4o
    temperature: 0.3
  prompt_version: 2026-01
  safety:
    max_daily_calls: 50
    max_monthly_cost: 50.0
    min_minutes_between_calls: 15
  schedule:
    enabled: false
    restrictions:
      night_block:
        enabled: false
        end: 02:00
        start: '22:00'
      weekend_block:
        enabled: true
        friday_start: '22:00'
        monday_end: '01:00'
    times: []
  screenshots:
    bars: 100
    cleanup_days: 7
    dpi: 150
    enabled: true
    timeframes:
    - M5
    - M15
    - M30
    - H1
  signal_validity_minutes: 60
  signals:
    auto_cleanup: true
    confidence_decay: true
    default_ttl_hours: 24
    min_confidence: 70
    min_rr: 1.5
    validity_minutes: 60
news_filter:
  cache_duration: 3600
  enabled: false
  instruments:
  - XAUUSD
  openai:
    max_tokens: 100
    model: gpt-4o-mini
    temperature: 0.1
  risk_actions:
    EXTREME: skip
    HIGH: reduce_50
    LOW: trade
    MEDIUM: reduce_75
