# Конфигурация автоматической очистки данных
# Auto-cleanup configuration

# Очистка AI сигналов
signals:
  # Максимальный возраст сигнала (в часах)
  # Сигналы старше этого времени будут удалены
  max_age_hours: 36
  
  # Время очистки (HH:MM в 24-часовом формате)
  # Очистка выполняется каждый день в указанное время
  cleanup_time: "22:00"

# Очистка логов
logs:
  # Максимальный возраст лог-файлов
  # Логи старше этого времени будут удалены
  max_age_days: 7
  max_age_hours: 20  # + дополнительные часы (итого: 7 дней 20 часов)
  
  # Время очистки (HH:MM в 24-часовом формате)
  cleanup_time: "22:00"
  
  # День недели для очистки (0=Monday, 1=Tuesday, ..., 6=Sunday)
  # Очистка выполняется раз в неделю в указанный день
  cleanup_day: 0  # Monday

# Примеры:
# - Сигналы: Удаляются каждый день в 22:00, если старше 36 часов
# - Логи: Удаляются каждый понедельник в 22:00, если старше 7 дней 20 часов
#
# Пример расчета:
#   Понедельник 21.01 02:00 - начали торговлю
#   Понедельник 21.01 22:00 - первая проверка сигналов (удалятся сигналы старше 20.01 10:00)
#   Вторник 22.01 22:00 - вторая проверка сигналов
#   ...
#   Понедельник 28.01 22:00 - проверка логов (удалятся логи старше 20.01 02:00)
