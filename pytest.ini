[tool:pytest]
# Pytest configuration for BAZA Trading Bot

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Console output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    risk: Risk management tests
    strategy: Strategy tests
    calculator: Calculator tests

# Coverage settings (если используется pytest-cov)
# addopts = --cov=src --cov-report=html --cov-report=term

# Ignore directories
norecursedirs = 
    .git
    .venv
    venv
    env
    __pycache__
    build
    dist
    *.egg

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
